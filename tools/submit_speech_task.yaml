identity:
  name: submit_speech_task
  author: wujian123
  label:
    en_US: Submit Speech Task
    zh_Hans: 提交长文本合成任务
description:
  human:
    en_US: >-
      Submit a long-text speech synthesis task (up to 200,000 characters).
      Text is chunked into 500-character blocks, synthesized and stitched
      into one audio file. Poll with get_speech_task.
    zh_Hans: >-
      提交长文本语音合成任务（≤20 万字）：平台按 500 字切块合成并拼接为完整音频。
      提交后用 get_speech_task 轮询结果。
  llm: >-
    Submit an asynchronous speech synthesis task for long text (up to
    200,000 characters). The service chunks the text into 500-character
    blocks, synthesizes each and stitches them into one complete audio
    file. Returns a taskNo immediately; poll with get_speech_task every
    10-30 seconds. Billed at about CNY 2 per 10,000 characters.
extra:
  python:
    source: tools/submit_speech_task.py
parameters:
  - name: text
    type: string
    required: true
    form: llm
    label:
      en_US: Text
      zh_Hans: 合成文本
    human_description:
      en_US: Long text to synthesize (<=200,000 characters).
      zh_Hans: 要合成的长文本（≤20 万字）。
    llm_description: The long text to convert to speech.
  - name: speaker
    type: string
    required: false
    form: llm
    default: default
    label:
      en_US: Speaker
      zh_Hans: 音色
    human_description:
      en_US: Voice code from list_tts_voices; default for the standard voice.
      zh_Hans: 音色代码，先用 list_tts_voices 查询；default 为标准音色。
    llm_description: >-
      Optional voice code (speaker); call list_tts_voices first. Defaults
      to "default".
  - name: audio_format
    type: select
    required: false
    form: llm
    default: wav
    options:
      - value: wav
        label:
          en_US: WAV
          zh_Hans: WAV
      - value: mp3
        label:
          en_US: MP3
          zh_Hans: MP3
    label:
      en_US: Audio Format
      zh_Hans: 音频格式
    human_description:
      en_US: Output audio format, wav by default.
      zh_Hans: 输出音频格式，默认 wav。
    llm_description: Output audio format, "wav" (default) or "mp3".
output_schema:
  type: object
  properties:
    taskNo:
      type: string
      description: Task id, poll with get_speech_task.
    hint:
      type: string
      description: Polling hint.
