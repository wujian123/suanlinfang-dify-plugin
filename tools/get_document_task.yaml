identity:
  name: get_document_task
  author: wujian123
  label:
    en_US: Get Document Task
    zh_Hans: 查询文档识别任务
description:
  human:
    en_US: >-
      Query a PDF document OCR task. On success resultUrl is a presigned
      download link for the aggregated result. Terminal states are kept
      for 72 hours.
    zh_Hans: >-
      查询 PDF 文档识别任务状态。success 时 resultUrl 为聚合结果下载链接。
      任务终态保留 72 小时。
  llm: >-
    Query the status of a PDF document OCR task submitted with
    submit_document_task. status is queued/running (watch
    doneUnits/totalUnits), success (resultUrl is a presigned download link
    for the aggregated result), or failed (errorMsg holds the reason).
    Terminal states are kept for 72 hours.
extra:
  python:
    source: tools/get_document_task.py
parameters:
  - name: task_no
    type: string
    required: true
    form: llm
    label:
      en_US: Task No
      zh_Hans: 任务编号
    human_description:
      en_US: taskNo returned by submit_document_task.
      zh_Hans: submit_document_task 返回的 taskNo。
    llm_description: The taskNo returned by submit_document_task.
output_schema:
  type: object
  properties:
    status:
      type: string
      description: queued / running / success / failed.
    totalUnits:
      type: number
      nullable: true
      description: Total pages.
    doneUnits:
      type: number
      nullable: true
      description: Completed pages.
    resultUrl:
      type: string
      nullable: true
      description: Presigned aggregated-result download URL on success.
    errorMsg:
      type: string
      nullable: true
      description: Failure reason when status is failed.
